name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: 6.3.3

jobs:
  windows:
    name: Windows engine and tray
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Swift toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command swift -ErrorAction SilentlyContinue)) {
            winget install --id Swift.Toolchain --exact --version $env:SWIFT_VERSION --silent `
              --accept-package-agreements --accept-source-agreements
            $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
              [Environment]::GetEnvironmentVariable("Path", "User")
          }
          $swift = Get-Command swift -ErrorAction Stop
          $swiftDirectory = Split-Path $swift.Source
          $swiftPathEntries = @(
            $env:Path -split ";" |
              Where-Object { $_ -match "[\\/]Swift[\\/]" -and (Test-Path -LiteralPath $_) }
            $swiftDirectory
          ) | Select-Object -Unique
          $swiftPathEntries |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $sdkRoot = [Environment]::GetEnvironmentVariable("SDKROOT", "Machine")
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) {
            $sdkRoot = [Environment]::GetEnvironmentVariable("SDKROOT", "User")
          }
          if ([string]::IsNullOrWhiteSpace($sdkRoot) -or
              -not (Test-Path -LiteralPath $sdkRoot)) {
            $swiftRoot = (Get-Item -LiteralPath $swiftDirectory).Parent.Parent.Parent.Parent.FullName
            $sdkRoot = Get-ChildItem -LiteralPath (Join-Path $swiftRoot "Platforms") -Directory |
              Sort-Object -Property LastWriteTimeUtc -Descending |
              ForEach-Object {
                Join-Path $_.FullName "Windows.platform\Developer\SDKs\Windows.sdk"
              } |
              Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($sdkRoot) -or
              -not (Test-Path -LiteralPath $sdkRoot)) {
            throw "The Swift Windows SDK could not be found."
          }
          $env:SDKROOT = $sdkRoot
          "SDKROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          swift --version
          swiftc -print-target-info

      - name: Build portable Windows engine
        shell: pwsh
        run: swift build -c release --product CodexBarWindowsEngine

      - name: Test portable core
        shell: pwsh
        run: swift test --filter Portable

      - name: Smoke test engine
        shell: pwsh
        run: |
          $binDirectory = swift build -c release --product CodexBarWindowsEngine --show-bin-path
          & "$binDirectory\CodexBarWindowsEngine.exe" --help
          & "$binDirectory\CodexBarWindowsEngine.exe" --version

      - name: Install .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: Windows/global.json

      - name: Build Windows tray application
        shell: pwsh
        working-directory: Windows
        run: dotnet build CodexBar.Windows.Tray/CodexBar.Windows.Tray.csproj -c Release

      - name: Test Windows engine client
        shell: pwsh
        working-directory: Windows
        run: dotnet run --project CodexBar.EngineClient.Tests/CodexBar.EngineClient.Tests.csproj -c Release

      - name: Package self-contained Windows preview
        shell: pwsh
        run: .\Windows\Publish-Windows.ps1 -SkipTests

      - name: Upload Windows preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexBar-win-x64
          path: |
            artifacts/windows/CodexBar-win-x64.zip
            artifacts/windows/CodexBar-win-x64.zip.sha256
          if-no-files-found: error
